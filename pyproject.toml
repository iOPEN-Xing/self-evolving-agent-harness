[tool.pytest.ini_options]
testpaths = ["tests", "examples/02-instruction-control/test_control_validation.py", "examples/23-final-assembly/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 先全库检查语法、未定义名字和明显错误；保留各讲原有教学排版。
select = ["E9", "F63", "F7", "F821", "F822", "F823"]
